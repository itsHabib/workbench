<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gate</title>
<style>
  :root {
    --serif: "Charter", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, Menlo, monospace;

    --bg: #faf9f6;
    --page: #ffffff;
    --ink: #1c2024;
    --muted: #6b7280;
    --faint: #9aa3af;
    --hairline: #e4e1da;
    --card-border: #d9d5cc;
    --card-shadow: 0 1px 2px rgba(28, 32, 36, 0.05);
    --edge: #b3ada0;
    --chip-bg: #f1efe9;

    --pass: #1a7f4b;
    --pass-bg: #e6f4ec;
    --block: #b3352d;
    --block-bg: #fbeae8;
    --escalate: #a16207;
    --escalate-bg: #fdf3e0;
    --refused: #6d4fa3;
    --refused-bg: #f0ebfa;
    --neutral: #52606d;
    --neutral-bg: #eef0f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a; --page: #161a23; --ink: #e8e6e1; --muted: #949dab; --faint: #6b7280;
      --hairline: #262b36; --card-border: #2c3340; --card-shadow: 0 1px 3px rgba(0,0,0,0.4);
      --edge: #4a5262; --chip-bg: #1f242f;
      --pass: #4ade80; --pass-bg: #12271b; --block: #f87171; --block-bg: #2c1615;
      --escalate: #fbbf24; --escalate-bg: #2a2110; --refused: #c4b5fd; --refused-bg: #211a33;
      --neutral: #9aa7b4; --neutral-bg: #1e242d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a; --page: #161a23; --ink: #e8e6e1; --muted: #949dab; --faint: #6b7280;
    --hairline: #262b36; --card-border: #2c3340; --card-shadow: 0 1px 3px rgba(0,0,0,0.4);
    --edge: #4a5262; --chip-bg: #1f242f;
    --pass: #4ade80; --pass-bg: #12271b; --block: #f87171; --block-bg: #2c1615;
    --escalate: #fbbf24; --escalate-bg: #2a2110; --refused: #c4b5fd; --refused-bg: #211a33;
    --neutral: #9aa7b4; --neutral-bg: #1e242d;
  }
  :root[data-theme="light"] {
    --bg: #faf9f6; --page: #ffffff; --ink: #1c2024; --muted: #6b7280; --faint: #9aa3af;
    --hairline: #e4e1da; --card-border: #d9d5cc; --card-shadow: 0 1px 2px rgba(28,32,36,0.05);
    --edge: #b3ada0; --chip-bg: #f1efe9;
    --pass: #1a7f4b; --pass-bg: #e6f4ec; --block: #b3352d; --block-bg: #fbeae8;
    --escalate: #a16207; --escalate-bg: #fdf3e0; --refused: #6d4fa3; --refused-bg: #f0ebfa;
    --neutral: #52606d; --neutral-bg: #eef0f2;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font-family: inherit; }

  header { max-width: 820px; margin: 0 auto; padding: 2.25rem 1.5rem 0; }
  .masthead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem 1rem; border-bottom: 2px solid var(--ink); padding-bottom: 0.7rem; }
  .masthead h1 { margin: 0; font-family: var(--serif); font-size: 1.5rem; font-weight: 700; letter-spacing: 0.01em; }
  .masthead .subtitle { color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 1rem; }
  .masthead .spacer { flex: 1; }
  .refresh { border: 1px solid var(--card-border); background: var(--page); color: var(--muted); border-radius: 6px; padding: 0.28rem 0.7rem; font-size: 0.8rem; cursor: pointer; }
  .refresh:hover { color: var(--ink); border-color: var(--muted); }
  .statusline { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 1rem; padding: 0.6rem 0 0; font-size: 0.8rem; color: var(--muted); }
  .chain-ok { color: var(--pass); font-weight: 600; }
  .chain-bad { color: var(--block); font-weight: 700; }
  .statusline .mono { font-family: var(--mono); font-size: 0.76rem; }
  .tamper-banner { max-width: 820px; margin: 1rem auto 0; padding: 0.7rem 1rem; border-radius: 8px; background: var(--block-bg); border: 1px solid var(--block); color: var(--block); font-weight: 650; }

  main { max-width: 820px; margin: 0 auto; padding: 1rem 1.5rem 4rem; }

  .section-label { font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 1.9rem 0 0.7rem; display: flex; align-items: baseline; gap: 0.5rem; }
  .section-label .count { font-family: var(--mono); color: var(--ink); }
  .card { background: var(--page); border: 1px solid var(--card-border); border-radius: 8px; box-shadow: var(--card-shadow); }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .mono { font-family: var(--mono); }

  .badge { display: inline-block; padding: 0.08rem 0.5rem; border-radius: 999px; font-size: 0.72rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid transparent; white-space: nowrap; }
  .b-pass { color: var(--pass); background: var(--pass-bg); border-color: color-mix(in srgb, var(--pass) 30%, transparent); }
  .b-block { color: var(--block); background: var(--block-bg); border-color: color-mix(in srgb, var(--block) 30%, transparent); }
  .b-escalate { color: var(--escalate); background: var(--escalate-bg); border-color: color-mix(in srgb, var(--escalate) 35%, transparent); }
  .b-refused { color: var(--refused); background: var(--refused-bg); border-color: color-mix(in srgb, var(--refused) 30%, transparent); }
  .b-unknown { color: var(--neutral); background: var(--neutral-bg); border-color: color-mix(in srgb, var(--neutral) 30%, transparent); }

  /* ---- parked runs ---- */
  .matter { padding: 1.1rem 1.3rem 1.15rem; cursor: pointer; }
  .matter + .matter { border-top: 1px solid var(--hairline); }
  .matter:hover { background: color-mix(in srgb, var(--chip-bg) 45%, transparent); }
  .matter-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 0.9rem; }
  .matter-head .rid { font-family: var(--mono); font-size: 0.78rem; }
  .matter-head .repo { font-weight: 600; font-size: 0.88rem; }
  .matter-head .pr-link { font-weight: 700; font-size: 0.9rem; text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
  .matter-title { margin-top: 0.5rem; font-family: var(--serif); font-size: 1.02rem; font-weight: 650; line-height: 1.4; }
  .state-note { margin-top: 0.35rem; color: var(--refused); font-family: var(--mono); font-size: 0.72rem; overflow-wrap: anywhere; }
  .matter-head .when { margin-left: auto; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .question { margin: 0.7rem 0 0.7rem; padding: 0.55rem 0.85rem; border-left: 3px solid var(--escalate); background: var(--escalate-bg); border-radius: 0 6px 6px 0; font-family: var(--serif); font-size: 0.92rem; line-height: 1.55; }
  .cmd-row { display: flex; align-items: stretch; gap: 0.4rem; margin-top: 0.55rem; }
  .cmd { flex: 1; padding: 0.4rem 0.6rem; background: var(--chip-bg); border: 1px solid var(--hairline); border-radius: 6px; font-family: var(--mono); font-size: 0.74rem; overflow-x: auto; white-space: nowrap; color: var(--ink); }
  .copy { border: 1px solid var(--card-border); background: var(--page); color: var(--muted); border-radius: 6px; padding: 0 0.6rem; font-size: 0.72rem; cursor: pointer; white-space: nowrap; }
  .copy:hover { color: var(--ink); border-color: var(--muted); }
  .copy.done { color: var(--pass); border-color: var(--pass); }
  .open-hint { margin-left: auto; font-size: 0.78rem; color: var(--muted); }
  .legacy { margin-top: 1rem; color: var(--muted); font-size: 0.82rem; }
  .legacy summary { cursor: pointer; }
  .legacy .card { margin-top: 0.55rem; }

  /* ---- grants ---- */
  .grant { display: grid; grid-template-columns: auto 1fr auto; gap: 0.3rem 0.9rem; align-items: baseline; padding: 0.7rem 1.3rem; font-size: 0.83rem; }
  .grant + .grant { border-top: 1px solid var(--hairline); }
  .grant .gid { font-family: var(--mono); font-size: 0.76rem; }
  .grant .meta { color: var(--muted); }
  .grant .meta .tier { font-family: var(--mono); font-weight: 650; color: var(--ink); }
  .grant .exp { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; white-space: nowrap; }
  .grant.expiring .exp { color: var(--escalate); font-weight: 600; }
  .grant.expired { opacity: 0.6; }
  .grant.expired .gid { text-decoration: line-through; text-decoration-thickness: 1px; }

  .empty { padding: 1.5rem 1.3rem; font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 0.95rem; }
  .error { max-width: 820px; margin: 1rem auto; padding: 0.9rem 1rem; border-radius: 8px; background: var(--block-bg); border: 1px solid color-mix(in srgb, var(--block) 40%, transparent); color: var(--block); font-size: 0.88rem; }
  .error .mono { font-family: var(--mono); font-size: 0.8rem; }

  /* ---- run view: back link ---- */
  .back { display: inline-block; font-size: 0.82rem; color: var(--muted); text-decoration: none; margin-top: 1.1rem; cursor: pointer; }
  .back:hover { color: var(--ink); }

  /* ---- run view: decision panel (flare escalation-card language) ---- */
  .panel { margin-top: 1rem; background: var(--page); border: 1px solid var(--card-border); border-radius: 10px; box-shadow: var(--card-shadow); overflow: hidden; }
  .panel-accent { height: 3px; background: var(--neutral); }
  .panel-accent.a-escalate { background: var(--escalate); }
  .panel-accent.a-pass { background: var(--pass); }
  .panel-accent.a-block { background: var(--block); }
  .panel-accent.a-refused { background: var(--refused); }
  .panel-body { padding: 1.3rem 1.45rem 1.35rem; }
  .panel-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 0.9rem; }
  .panel-headline { font-family: var(--serif); font-size: 1.2rem; font-weight: 700; }
  .panel-sub { margin-left: auto; }
  .panel-subject { font-family: var(--mono); font-size: 0.82rem; font-weight: 600; text-decoration-thickness: 1px; text-underline-offset: 0.16em; white-space: nowrap; }
  .brief-fields { margin: 1rem 0 0; display: grid; gap: 0.7rem; }
  .brief-field { font-size: 0.94rem; line-height: 1.62; font-family: var(--serif); overflow-wrap: anywhere; }
  .brief-field .bl { font-weight: 700; }
  .brief-field .bl.risk-low { color: var(--pass); }
  .brief-field .bl.risk-medium { color: var(--escalate); }
  .brief-field .bl.risk-high { color: var(--block); }
  .no-brief-note { margin-top: 0.85rem; font-size: 0.79rem; color: var(--faint); font-style: italic; font-family: var(--serif); line-height: 1.5; }
  .panel .cmd-row { margin-top: 0.85rem; }
  .panel .open-hint { margin: 0.55rem 0 0; }
  .judge-actions { margin-top: 1.1rem; display: grid; gap: 0.7rem; }
  .judge { border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden; }
  .judge-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; }
  .judge-head .copy { margin-left: auto; }
  .judge-cmd { display: block; padding: 0.65rem 0.8rem; border-top: 1px solid var(--hairline); background: var(--chip-bg); font-family: var(--mono); font-size: 0.76rem; line-height: 1.65; white-space: pre-wrap; word-break: break-all; color: var(--ink); }
  .panel-foot { margin-top: 1.15rem; padding-top: 0.7rem; border-top: 1px solid var(--hairline); display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; font-size: 0.73rem; color: var(--faint); font-family: var(--mono); overflow-wrap: anywhere; }
  .panel-foot b { color: var(--muted); font-weight: 600; }

  /* ---- run view: verifier ladder ---- */
  .ladder { padding: 0.35rem 0.45rem; }
  .check { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.8rem; padding: 0.85rem 0.95rem; }
  .check + .check { border-top: 1px solid var(--hairline); }
  .check.synthesis { border-top: 1px solid var(--card-border); background: color-mix(in srgb, var(--chip-bg) 40%, transparent); }
  .check-glyph { width: 1.1rem; text-align: center; font-weight: 700; font-size: 0.95rem; }
  .g-pass { color: var(--pass); } .g-escalate { color: var(--escalate); } .g-block { color: var(--block); } .g-refused { color: var(--refused); } .g-synthesis { color: var(--muted); }
  .check-src { font-weight: 650; font-size: 0.9rem; min-width: 7rem; }
  .check-tier { font-family: var(--mono); font-size: 0.72rem; color: var(--faint); }
  .check-why { flex: 1 1 15rem; font-family: var(--serif); font-size: 0.9rem; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
  .check-producer { flex-basis: 100%; margin: 0.1rem 0 0 1.8rem; font-family: var(--mono); font-size: 0.68rem; color: var(--faint); }
  .check .findings { flex-basis: 100%; margin-left: 1.8rem; }
  .evfoot { margin-top: 1.25rem; font-size: 0.79rem; color: var(--faint); font-family: var(--serif); }
  .evfoot .ev-item { font-family: var(--mono); font-size: 0.73rem; color: var(--muted); }

  /* ---- findings (shared with the ladder rows) ---- */
  .findings { margin-top: 0.4rem; border-top: 1px solid var(--hairline); padding-top: 0.45rem; }
  .findings summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
  .findings summary:hover { color: var(--ink); }
  .findings ul { margin: 0.4rem 0 0; padding: 0; list-style: none; max-height: 22rem; overflow-y: auto; }
  .findings li { padding: 0.3rem 0.2rem; font-size: 0.8rem; border-bottom: 1px solid var(--hairline); color: var(--muted); }
  .findings li:last-child { border-bottom: none; }
  .sev { display: inline-block; min-width: 3.4em; font-weight: 650; text-transform: uppercase; font-size: 0.66rem; letter-spacing: 0.05em; }
  .sev-high, .sev-critical { color: var(--block); } .sev-medium { color: var(--escalate); }
  .f-ev { font-family: var(--mono); font-size: 0.72rem; color: var(--faint); }

  .colophon { margin-top: 2.5rem; padding-top: 0.8rem; border-top: 1px solid var(--hairline); color: var(--faint); font-size: 0.74rem; font-family: var(--serif); font-style: italic; }
  @media (max-width: 560px) { .check-src { min-width: 0; } .panel-sub { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="masthead">
    <h1>gate</h1>
    <span class="subtitle">what needs you</span>
    <span class="spacer"></span>
    <button class="refresh" id="refresh" type="button">refresh</button>
  </div>
  <div class="statusline" id="statusline"></div>
</header>
<div id="banner"></div>
<main id="view"></main>

<script>
(function () {
  "use strict";

  var view = document.getElementById("view");
  var statusline = document.getElementById("statusline");
  var banner = document.getElementById("banner");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function el(id) { return document.getElementById(id); }

  async function getJSON(url) {
    var res = await fetch(url, { headers: { "Accept": "application/json" } });
    var body = await res.json().catch(function () { return null; });
    if (!res.ok) {
      var msg = body && body.error ? body.error : ("HTTP " + res.status);
      throw new Error(msg);
    }
    return body;
  }

  function errorHTML(context, err) {
    return '<div class="error"><strong>' + esc(context) + '</strong><br><span class="mono">' + esc(err.message) + "</span></div>";
  }

  // ---------- routing ----------
  function runIdFromPath() {
    var m = location.pathname.match(/^\/run\/(run_[0-9a-f]+)$/);
    return m ? m[1] : null;
  }
  function go(path) {
    history.pushState(null, "", path);
    route();
  }
  window.addEventListener("popstate", route);

  function route() {
    var id = runIdFromPath();
    if (id) { renderRun(id); } else { renderDocket(); }
  }

  el("refresh").addEventListener("click", route);

  // ---------- audit line ----------
  async function renderAudit() {
    banner.innerHTML = "";
    try {
      var a = await getJSON("/api/audit");
      if (a.ok) {
        statusline.innerHTML = '<span class="chain-ok">chain intact</span>' + auditTime();
        return;
      }
      statusline.innerHTML = '<span class="chain-bad">CHAIN TAMPERED</span>' + auditTime();
      banner.innerHTML = '<div class="tamper-banner">gate audit reports the log has been tampered with: <span class="mono">' + esc(a.reason) + "</span></div>";
    } catch (err) {
      statusline.innerHTML = '<span class="faint">audit unavailable — ' + esc(err.message) + "</span>";
    }
  }
  function auditTime() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    return ' <span class="faint">· checked ' + hh + "</span>";
  }

  // ---------- docket ----------
  async function renderDocket() {
    document.title = "gate";
    renderAudit();
    view.innerHTML = '<p class="muted" style="padding:1rem 0">loading…</p>';
    var data;
    try {
      data = await getJSON("/api/next");
    } catch (err) {
      view.innerHTML = errorHTML("Could not reach gate.", err);
      return;
    }
    var parked = data.parked || [];
    var unattributed = data.unattributed || [];
    var grants = data.grants || [];
    var ready = data.ready_to_merge || [];
    var needsGrant = data.needs_grant || [];
    var html = "";

    // Ready to merge leads: a clean, judged PR is one copy-and-run from landed —
    // the most actionable state on the docket. Hidden entirely when empty.
    if (ready.length > 0) {
      html += '<div class="section-label">ready to merge <span class="count">(' + ready.length + ")</span></div>";
      html += '<div class="card">' + ready.map(readyCard).join("") + "</div>";
    }

    html += '<div class="section-label">awaiting judgment <span class="count">(' + parked.length + ")</span></div>";
    if (parked.length === 0) {
      html += '<div class="card"><div class="empty">Nothing awaits judgment.</div></div>';
    } else {
      html += '<div class="card">' + parked.map(parkedCard).join("") + "</div>";
    }

    // Repos whose merge grant has lapsed — a paste-ready re-mint per row. Hidden
    // when empty (a covered repo never trains the operator to ignore this).
    if (needsGrant.length > 0) {
      html += '<div class="section-label">needs a grant <span class="count">(' + needsGrant.length + ")</span></div>";
      html += '<div class="card">' + needsGrant.map(needsGrantCard).join("") + "</div>";
    }

    if (unattributed.length > 0) {
      html += '<details class="legacy"><summary>' + unattributed.length +
        ' legacy parked run' + (unattributed.length === 1 ? "" : "s") +
        ' without PR identity — diagnostic history, not counted above</summary>' +
        '<div class="card">' + unattributed.map(parkedCard).join("") + "</div></details>";
    }

    html += '<div class="section-label">grants</div>';
    if (grants.length === 0) {
      html += '<div class="card"><div class="empty">No grants on record.</div></div>';
    } else {
      html += '<div class="card">' + grants.map(grantRow).join("") + "</div>";
    }

    html += '<p class="colophon">Every row is a projection of gate’s append-only, hash-chained log. This page renders; it never decides.</p>';
    view.innerHTML = html;
    wireCopy();
    wireOpen();
  }

  function parkedCard(p) {
    var subject = "";
    if (p.repo) {
      var label = esc(p.repo) + "#" + esc(p.number);
      subject = p.url
        ? '<a class="pr-link" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">' + label + " ↗</a>"
        : '<span class="repo">' + label + "</span>";
    }
    var when = p.parked_at ? '<span class="when">parked ' + esc(p.parked_at.replace("T", " ").replace("Z", " UTC")) + "</span>" : "";
    var code = p.code ? '<span class="badge b-escalate">' + esc(p.code) + "</span>" : '<span class="badge b-escalate">parked</span>';
    var liveState = p.pr_state === "unknown" ? '<span class="badge b-refused">PR state unknown</span>' : "";
    var stateNote = p.pr_state_reason ? '<div class="state-note">' + esc(p.pr_state_reason) + "</div>" : "";
    var title = p.title ? '<div class="matter-title">' + esc(p.title) + "</div>" : "";
    var q = p.question ? '<div class="question">' + esc(p.question) + "</div>" : "";
    return (
      '<div class="matter" data-run="' + esc(p.run) + '">' +
      '<div class="matter-head">' + subject + code + liveState + when + "</div>" +
      title +
      '<div class="rid muted">run ' + esc(p.run) + (p.head_sha ? " · head " + esc(p.head_sha.slice(0, 12)) : "") + "</div>" +
      stateNote +
      q +
      docketJudge(p) +
      cmdRow(p.explain_command) +
      '<div class="open-hint">click the run to open its trace →</div>' +
      "</div>"
    );
  }

  function cmdRow(cmd) {
    if (!cmd) return "";
    return '<div class="cmd-row"><code class="cmd">' + esc(cmd) + '</code>' +
      '<button class="copy" type="button" data-copy="' + esc(cmd) + '">copy</button></div>';
  }

  // A ready-to-merge card: the clickable PR subject + title, run demoted to a
  // diagnostic line, and gate's own paste-ready merge command with a copy button.
  function readyCard(r) {
    var subject = "";
    if (r.repo) {
      var label = esc(r.repo) + "#" + esc(r.number);
      subject = r.url
        ? '<a class="pr-link" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + label + " ↗</a>"
        : '<span class="repo">' + label + "</span>";
    }
    var title = r.title ? '<div class="matter-title">' + esc(r.title) + "</div>" : "";
    return (
      '<div class="matter" data-run="' + esc(r.run) + '">' +
      '<div class="matter-head">' + subject + '<span class="badge b-pass">ready to merge</span></div>' +
      title +
      '<div class="rid muted">run ' + esc(r.run) + (r.head_sha ? " · head " + esc(r.head_sha.slice(0, 12)) : "") + "</div>" +
      cmdRow(r.merge_command) +
      '<div class="open-hint">click the run to open its trace →</div>' +
      "</div>"
    );
  }

  // A needs-a-grant card: the repo, its lapsed grant state (+ open-PR count on
  // the live path), the last-expired stamp, and a paste-ready re-mint command.
  function needsGrantCard(g) {
    var open = (g.open_prs || g.open_prs === 0) ? '<span class="when">' + esc(g.open_prs) + ' open PR' + (g.open_prs === 1 ? "" : "s") + "</span>" : "";
    var state = '<span class="badge b-refused">' + esc(g.grant_state) + "</span>";
    var expired = g.last_expired_at ? '<div class="rid muted">last expired ' + esc(g.last_expired_at.replace("T", " ").replace("Z", " UTC")) + "</div>" : "";
    return (
      '<div class="matter">' +
      '<div class="matter-head"><span class="repo">' + esc(g.repo) + "</span>" + state + open + "</div>" +
      expired +
      cmdRow(g.suggested_mint) +
      "</div>"
    );
  }

  // Dual PASS/BLOCK judge commands on a docket card, built from gate's own
  // judge_command (so -state is already baked in) with a drafted -why. Same
  // blocks as the run view; the operator can act without clicking through.
  function docketJudge(p) {
    if (!p.judge_command) return "";
    var parts = p.judge_command.split(" -decision ");
    if (parts.length < 2) return cmdRow(p.judge_command); // unexpected shape — show gate's command as-is
    var base = parts[0];
    var passCmd = base + ' -decision pass -why "cleared after review"';
    var blockWhy = p.question ? sanitizeWhy("blocked — " + firstSeg(p.question)) : "blocked";
    var blockCmd = base + ' -decision block -why "' + blockWhy + '"';
    return '<div class="judge-actions">' + judgeRow("pass", passCmd) + judgeRow("block", blockCmd) + "</div>";
  }

  function grantRow(g) {
    var cls = "grant" + (g.expired ? " expired" : (isExpiringSoon(g) ? " expiring" : ""));
    var when = g.expired ? "expired " + esc(g.remaining) : esc(g.remaining);
    return (
      '<div class="' + cls + '">' +
      '<span class="gid">' + esc(g.id) + "</span>" +
      '<span class="meta">' + esc(g.repo) + " · " + esc(g.action) + " · ceiling <span class=\"tier\">" + esc(g.max_tier) + "</span></span>" +
      '<span class="exp">' + when + "</span>" +
      "</div>"
    );
  }
  function isExpiringSoon(g) {
    return !g.expired && /^in (\d+m|<1m)$/.test(g.remaining || "");
  }

  function wireOpen() {
    var cards = view.querySelectorAll(".matter[data-run]");
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener("click", function (e) {
        if (e.target.closest(".copy, a")) return; // controls and PR links keep their own navigation
        go("/run/" + this.getAttribute("data-run"));
      });
    }
  }

  function wireCopy() {
    var btns = view.querySelectorAll(".copy[data-copy]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function (e) {
        e.stopPropagation();
        var text = this.getAttribute("data-copy");
        var btn = this;
        copyText(text).then(function () {
          btn.textContent = "copied"; btn.classList.add("done");
          setTimeout(function () { btn.textContent = "copy"; btn.classList.remove("done"); }, 1200);
        });
      });
    }
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ---------- run view (trace) ----------
  // The console's -state dir, fetched once, so the run view can render a fully
  // paste-ready judge command (the docket already gets it baked in by gate next).
  var cfgState = null;
  async function loadConfig() {
    if (cfgState !== null) return cfgState;
    try { var c = await getJSON("/api/config"); cfgState = (c && c.state) || ""; }
    catch (e) { cfgState = ""; }
    return cfgState;
  }

  async function renderRun(id) {
    document.title = "gate · " + id;
    renderAudit();
    view.innerHTML = '<a class="back" id="back">← what needs you</a><p class="muted" style="padding:1rem 0">loading ' + esc(id) + "…</p>";
    el("back").addEventListener("click", function () { go("/"); });
    var doc;
    try {
      doc = await getJSON("/api/run/" + encodeURIComponent(id));
    } catch (err) {
      view.innerHTML = '<a class="back" id="back2">← what needs you</a>' + errorHTML("Could not load run " + id + ".", err);
      el("back2").addEventListener("click", function () { go("/"); });
      return;
    }
    var state = await loadConfig();
    renderTrace(doc, state);
  }

  function badgeFor(decisionOrOutcome) {
    var k = String(decisionOrOutcome || "").toLowerCase();
    if (k === "pass" || k === "would_merge" || k === "merged" || k === "merge_not_implemented") return "b-pass";
    if (k === "block" || k === "blocked") return "b-block";
    if (k === "escalate" || k === "parked_for_judgment") return "b-escalate";
    if (k === "capability_refused") return "b-refused";
    return "b-unknown";
  }

  // The terminal artifact: the escalation (parked) or action (merged) that closed the run.
  function findTerminal(arts) {
    for (var i = arts.length - 1; i >= 0; i--) {
      if (arts[i].kind === "escalation" || arts[i].kind === "action") return arts[i];
    }
    return null;
  }

  var RISK_RE = /^\s*(low|medium|high)\b/i;

  function renderTrace(doc, state) {
    var arts = (doc && doc.artifacts) || [];
    var term = findTerminal(arts);
    var reducer = null, verifiers = [], evidence = [];
    for (var i = 0; i < arts.length; i++) {
      var a = arts[i];
      if (a.kind === "evidence") { evidence.push(a); continue; }
      if ((a.kind === "verdict" || a.kind === "judgment") && a.verdict) {
        if (a.verdict.source === "reducer") reducer = a.verdict; else verifiers.push(a.verdict);
      }
    }

    var checks = verifiers.map(checkRow).join("") + (reducer ? synthesisRow(reducer) : "");
    var html =
      '<a class="back" id="back">← what needs you</a>' +
      briefPanel(doc.run, term, reducer, verifiers, state) +
      '<div class="section-label">how gate got here <span class="count">' +
        verifiers.length + (verifiers.length === 1 ? " check" : " checks") + "</span></div>" +
      '<div class="card"><div class="ladder">' +
        (checks || '<div class="empty">No verifier verdicts recorded.</div>') + "</div></div>" +
      evidenceFoot(evidence) +
      '<p class="colophon">Read verbatim from gate’s append-only, hash-chained log. This page renders; it never decides.</p>';

    view.innerHTML = html;
    el("back").addEventListener("click", function () { go("/"); });
    wireCopy();
  }

  // The decision panel — mirrors flare's escalation Slack card: outcome + subject,
  // then gate's synthesized brief (What it is / The concern / Risk / Recommendation)
  // when present, else gate's own verdict text verbatim. It never editorializes.
  function briefPanel(run, term, reducer, verifiers, state) {
    var flat = (term && term.flat) || {};
    var outcome = flat.outcome || (reducer ? decisionOutcome(reducer.decision) : "");
    var repo = flat.repo || subjectRepo(verifiers, reducer);
    var number = flat.number != null ? flat.number : subjectNumber(verifiers, reducer);
    var tier = reducer ? reducer.tier : "";
    var grant = flat.grant || "";

    var body = flat.brief ? realBrief(flat.brief) : synthBrief(flat, reducer, verifiers);

    var action = "";
    if (outcome === "parked_for_judgment" && grant) {
      // Offer BOTH judgments, each fully formed (carrying -state) with a -why
      // pre-drafted from gate's own verdicts. Both ways are shown equally — the
      // console suggests wording and saves typing; it never pre-decides.
      var base = "gate judge" + (state ? " -state " + shellArg(state) : "") + " -run " + run + " -grant " + grant;
      var passCmd = base + ' -decision pass -why "' + judgeWhy("pass", reducer, verifiers, flat) + '"';
      var blockCmd = base + ' -decision block -why "' + judgeWhy("block", reducer, verifiers, flat) + '"';
      action =
        '<div class="judge-actions">' + judgeRow("pass", passCmd) + judgeRow("block", blockCmd) + "</div>" +
        '<div class="open-hint faint">Both ready to run — copy one, tweak the reason if you like.' +
        (state ? "" : ' <span class="mono">-state</span> unknown here; copy the exact command from the inbox.') + "</div>";
    }

    var foot = "";
    if (tier) foot += "<span><b>tier</b> " + esc(tier) + "</span>";
    foot += "<span><b>run</b> " + esc(run) + "</span>";
    if (grant) foot += "<span><b>grant</b> " + esc(grant) + "</span>";

    return (
      '<div class="panel"><div class="panel-accent ' + accentFor(outcome) + '"></div><div class="panel-body">' +
      '<div class="panel-top">' +
        '<span class="badge ' + badgeFor(outcome) + '">' + esc(outcomeWord(outcome)) + "</span>" +
        '<span class="panel-headline">' + esc(headlineFor(outcome)) + "</span>" +
        subjectLink(repo, number) +
      "</div>" +
      body + action +
      '<div class="panel-foot">' + foot + "</div>" +
      "</div></div>"
    );
  }

  // gate's synthesized brief — the four fields flare renders, same labels + order.
  function realBrief(b) {
    var rows = [
      ["What it is", b.what_it_is, ""],
      ["The concern", b.concern, ""],
      ["Risk", b.risk, riskClass(b.risk)],
      ["Recommendation", b.recommendation, ""]
    ];
    var out = "";
    for (var i = 0; i < rows.length; i++) {
      if (!rows[i][1]) continue;
      out += '<div class="brief-field"><span class="bl ' + rows[i][2] + '">' + esc(rows[i][0]) + ":</span> " + esc(rows[i][1]) + "</div>";
    }
    return '<div class="brief-fields">' + out + "</div>";
  }
  function riskClass(r) { var m = RISK_RE.exec(r || ""); return m ? "risk-" + m[1].toLowerCase() : ""; }

  // No gate brief (procedural / no-review park): restate gate's own verdicts
  // verbatim. The console renders — it never invents a recommendation gate didn't make.
  function synthBrief(flat, reducer, verifiers) {
    var out = "";
    var floor = firstSource(verifiers, "triage-floor");
    if (floor && floor.why) {
      out += '<div class="brief-field"><span class="bl">What it is:</span> ' + esc((floor.tier ? floor.tier + " — " : "") + floor.why) + "</div>";
    }
    var why = (reducer && reducer.why) || flat.question || "";
    if (why) out += '<div class="brief-field"><span class="bl">Why it’s parked:</span> ' + esc(why) + "</div>";
    if (!out) out = '<div class="brief-field muted">No verdict detail recorded.</div>';
    return '<div class="brief-fields">' + out + "</div>" +
      '<div class="no-brief-note">Gate synthesizes a plain-language brief only for content escalations. This is a procedural park — shown from its verdicts verbatim.</div>';
  }

  function checkRow(v) {
    var d = String(v.decision || "").toLowerCase();
    return (
      '<div class="check">' +
      '<span class="check-glyph ' + glyphClass(d) + '">' + glyphFor(d) + "</span>" +
      '<span class="check-src">' + esc(prettySource(v.source)) + "</span>" +
      '<span class="check-tier">' + esc(v.tier || "") + "</span>" +
      '<span class="check-why">' + esc(v.why || "") + "</span>" +
      (v.producer ? '<span class="check-producer">' + esc(v.producer) + "</span>" : "") +
      findingsBody(v.findings) +
      "</div>"
    );
  }

  function synthesisRow(r) {
    var d = String(r.decision || "").toLowerCase();
    var verb = d === "escalate" ? "escalated to you" : d === "pass" ? "cleared to merge" : d === "block" ? "blocked" : d;
    return (
      '<div class="check synthesis">' +
      '<span class="check-glyph g-synthesis">Σ</span>' +
      '<span class="check-src">reducer</span>' +
      '<span class="check-tier">' + esc(r.tier || "") + "</span>" +
      '<span class="check-why">worst decision wins → <strong>' + esc(verb) + "</strong></span>" +
      "</div>"
    );
  }

  function evidenceFoot(evidence) {
    if (!evidence.length) return "";
    var items = [];
    for (var i = 0; i < evidence.length; i++) {
      var e = evidence[i].evidence;
      var t = e && e.type ? e.type : evidence[i].kind;
      items.push('<span class="ev-item">' + esc(t) + "</span>");
    }
    return '<div class="evfoot">Inputs gate gathered: ' + items.join(" · ") + "</div>";
  }

  function findingsBody(findings) {
    if (!findings || !findings.length) return "";
    var items = "";
    for (var i = 0; i < findings.length; i++) {
      var f = findings[i];
      var line = "";
      if (f.severity) line += '<span class="sev sev-' + esc(String(f.severity).toLowerCase()) + '">' + esc(f.severity) + "</span> ";
      line += "<span>" + esc(f.title) + "</span>";
      if (f.locus) line += ' <span class="f-ev">' + esc(f.locus) + "</span>";
      if (f.evidence) line += ' — <span class="f-ev">' + esc(f.evidence) + "</span>";
      items += "<li>" + line + "</li>";
    }
    return '<details class="findings"><summary>' + findings.length + " finding" + (findings.length === 1 ? "" : "s") + "</summary><ul>" + items + "</ul></details>";
  }

  // ---- judge commands (both ways, pre-drafted) ----
  function judgeRow(kind, cmd) {
    var cls = kind === "pass" ? "b-pass" : "b-block";
    return '<div class="judge">' +
      '<div class="judge-head"><span class="badge ' + cls + '">' + kind + "</span>" +
      '<button class="copy" type="button" data-copy="' + esc(cmd) + '">copy</button></div>' +
      '<code class="judge-cmd">' + esc(cmd) + "</code></div>";
  }
  // A drafted -why the operator can accept or edit — pass restates the floor's
  // read, block restates the reason gate raised. Both are gate's own words, not
  // the console's judgment.
  function judgeWhy(kind, reducer, verifiers, flat) {
    if (kind === "pass") {
      var floor = firstSource(verifiers, "triage-floor");
      return floor && floor.why ? sanitizeWhy("cleared — " + floor.why) : "cleared after review";
    }
    var reason = firstSeg((reducer && reducer.why) || (flat && flat.question) || "");
    return reason ? sanitizeWhy("blocked — " + reason) : "blocked";
  }
  function firstSeg(s) { return String(s || "").split(";")[0].trim(); }
  function sanitizeWhy(s) { return String(s).replace(/"/g, "'"); } // keep the -why "..." shell string intact
  function shellArg(v) { return /\s/.test(v) ? '"' + v + '"' : v; }

  // ---- small helpers ----
  function glyphFor(d) { return d === "pass" ? "✓" : d === "block" ? "✕" : d === "capability_refused" ? "⊘" : "!"; }
  function glyphClass(d) { return d === "pass" ? "g-pass" : d === "block" ? "g-block" : d === "capability_refused" ? "g-refused" : "g-escalate"; }
  function prettySource(s) { return String(s || "") === "review-consolidation" ? "review panel" : String(s || ""); }
  function firstSource(list, src) { for (var i = 0; i < list.length; i++) { if (list[i].source === src) return list[i]; } return null; }
  function decisionOutcome(d) {
    d = String(d || "").toLowerCase();
    return d === "escalate" ? "parked_for_judgment" : d === "pass" ? "would_merge" : d === "block" ? "blocked" : d;
  }
  function outcomeWord(o) {
    o = String(o || "").toLowerCase();
    if (o === "parked_for_judgment") return "parked for you";
    if (o === "would_merge") return "would merge";
    if (o === "blocked") return "blocked";
    if (o === "capability_refused") return "refused";
    return o.replace(/_/g, " ") || "recorded";
  }
  function headlineFor(o) {
    o = String(o || "").toLowerCase();
    if (o === "parked_for_judgment") return "Your call";
    if (o === "would_merge") return "Ready to merge";
    if (o === "blocked") return "Blocked from merging";
    if (o === "capability_refused") return "Capability refused";
    return "Decision recorded";
  }
  function accentFor(o) {
    o = String(o || "").toLowerCase();
    if (o === "would_merge") return "a-pass";
    if (o === "blocked") return "a-block";
    if (o === "capability_refused") return "a-refused";
    if (o === "parked_for_judgment") return "a-escalate";
    return "";
  }
  function subjectRepo(verifiers, reducer) {
    var all = reducer ? verifiers.concat([reducer]) : verifiers;
    for (var i = 0; i < all.length; i++) {
      var s = all[i].subject;
      if (s && s.repo) return s.repo;
    }
    return "";
  }
  function subjectNumber(verifiers, reducer) {
    var all = reducer ? verifiers.concat([reducer]) : verifiers;
    for (var i = 0; i < all.length; i++) {
      var s = all[i].subject;
      if (s && s.number != null) return s.number;
    }
    return null;
  }
  function subjectLink(repo, number) {
    if (!repo || number == null) return "";
    var label = esc(repo) + "#" + esc(number);
    var url = "https://github.com/" + repo + "/pull/" + number;
    return '<a class="panel-sub panel-subject" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + label + " ↗</a>";
  }

  route();
})();
</script>
</body>
</html>
