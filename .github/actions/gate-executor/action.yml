name: Custodied Gate executor
description: Keep the App private key and installation token inside one trusted Gate process.
inputs:
  request:
    required: true
  state-tip:
    required: true
  workflow-run-id:
    required: true
  workflow-actor-id:
    required: true
  workflow-triggering-actor:
    required: true
  app-id:
    required: true
  installation-id:
    required: true
  state-dir:
    required: true
  key-dir:
    required: true
  api-url:
    required: true
runs:
  using: docker
  image: Dockerfile
  args:
    - executor
    - run
    - -request
    - ${{ inputs.request }}
    - -state-tip
    - ${{ inputs.state-tip }}
    - -workflow-run-id
    - ${{ inputs.workflow-run-id }}
    - -workflow-actor-id
    - ${{ inputs.workflow-actor-id }}
    - -workflow-triggering-actor
    - ${{ inputs.workflow-triggering-actor }}
    - -app-id
    - ${{ inputs.app-id }}
    - -installation-id
    - ${{ inputs.installation-id }}
    - -state
    - ${{ inputs.state-dir }}
    - -key
    - ${{ inputs.key-dir }}
    - -api-url
    - ${{ inputs.api-url }}
