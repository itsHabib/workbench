name: Custodied Gate executor
description: Run Gate as the Docker entrypoint so the App private key and token stay inside its process boundary.
inputs:
  claim:
    required: true
  app-id:
    required: true
  installation-id:
    required: true
  app-private-key:
    required: true
  github-read-token:
    required: true
  state-dir:
    required: true
  key-dir:
    required: true
  api-url:
    required: true
runs:
  using: docker
  image: Dockerfile
  args:
    - executor
    - execute
    - -claim
    - ${{ inputs.claim }}
    - -app-id
    - ${{ inputs.app-id }}
    - -installation-id
    - ${{ inputs.installation-id }}
    - -state
    - ${{ inputs.state-dir }}
    - -key
    - ${{ inputs.key-dir }}
    - -api-url
    - ${{ inputs.api-url }}
