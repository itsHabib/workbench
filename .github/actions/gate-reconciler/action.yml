name: Custodied Gate claim reconciler
description: Close one expired Gate claim without accepting or invoking a merge command.
inputs:
  claim:
    required: true
  state-tip:
    required: true
  app-id:
    required: true
  installation-id:
    required: true
  app-private-key:
    required: true
  state-dir:
    required: true
  key-dir:
    required: true
  api-url:
    required: true
runs:
  using: docker
  image: Dockerfile
  args:
    - executor
    - reconcile
    - -claim
    - ${{ inputs.claim }}
    - -state-tip
    - ${{ inputs.state-tip }}
    - -app-id
    - ${{ inputs.app-id }}
    - -installation-id
    - ${{ inputs.installation-id }}
    - -state
    - ${{ inputs.state-dir }}
    - -key
    - ${{ inputs.key-dir }}
    - -api-url
    - ${{ inputs.api-url }}
