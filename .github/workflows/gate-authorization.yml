name: gate authorization

# Promotion rail for a locally produced GateAuthorizationV1 artifact. The job is
# held by the protected gate-authorization environment; its required reviewer is
# the trust root. It always builds trusted default-branch code and never checks
# out or executes the PR/fork head.
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Complete GateAuthorizationV1 JSON
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  promote:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gate-authorization
    concurrency:
      # Deliberately global and low-volume. An attacker cannot select a different
      # group through untrusted artifact fields to race replay detection.
      group: gate-authorization-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORIZATION: ${{ inputs.authorization }}
      RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      - name: Checkout base (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Gate from base
        run: go build -o gate ./cmd/gate

      - name: Promote exact-head authorization
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/gate-authorization.json"
          printf '%s' "${AUTHORIZATION}" >"${artifact}"
          ./gate authorization promote -artifact "${artifact}" -run-url "${RUN_URL}" |
            tee gate-authorization-result.json
          {
            echo "## Gate authorization promotion"
            echo '```json'
            cat gate-authorization-result.json
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
