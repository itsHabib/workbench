name: gate

# Fork-safe enforcement check. workflow_run performs the first evaluation after
# CI settles. Narrow bot-only review events re-evaluate a parked exact-head panel
# when evidence arrives later. Every path runs the workflow from the trusted
# default branch and checks out only that base — never PR/fork code.
on:
  workflow_run:
    workflows: ["CI", "gate-review-signal"]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number to re-evaluate
        required: true
        type: string
  push:
    paths: [".ship.json"]

# Least privilege: post the gate status, read the code/PR/checks/logs gate
# needs as evidence. No write access to contents or pull-requests.
permissions:
  statuses: write
  contents: read
  actions: read
  pull-requests: read

# Bound the work. Collapse workflow_run and late-review re-evaluations to one
# in-flight run per PR — newer evidence cancels the older run, which is the
# correct one to keep. This is a cost/DoS bound, not a correctness one:
# cancellation leaves the required
# `gate` context absent, which fail-closed blocks until the surviving run posts.
concurrency:
  group: gate-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # DORMANT until armed. The runtime is now self-contained on a stock hosted
    # runner: gate and triage-floor are built in-workflow (below), and the
    # optional red-CI classifier has a cloud backend. The two remaining
    # requirements are operator acts: set repo variable
    # GATE_ENFORCE=true AND provide the ANTHROPIC_API_KEY secret. Until
    # GATE_ENFORCE=true this posts nothing and enforces nothing. See
    # docs/enforcement.md. (Also skips non-PR CI runs — a push to main has no PR
    # to gate.) It runs on EVERY PR CI conclusion, including cancelled/failed: a
    # cancelled or red run must still reach gate so readiness sees the non-green
    # rollup and blocks (overwriting any stale gate=success on the head). Skipping
    # cancelled runs would let a user with Actions rights cancel CI to keep a
    # persistent stale success alive — a fail-open. The DoS bound is the
    # concurrency group above, not a conclusion filter.
    if: >-
      vars.GATE_ENFORCE == 'true'
      && (
        (github.event_name == 'workflow_run'
          && (
            (github.event.workflow_run.name == 'CI'
              && github.event.workflow_run.event == 'pull_request')
            || (github.event.workflow_run.name == 'gate-review-signal'
              && github.event.workflow_run.event == 'pull_request_review'
              && github.event.workflow_run.conclusion == 'success')
          ))
        || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && (github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
            || github.event.comment.user.login == 'claude[bot]'))
        || (github.event_name == 'workflow_dispatch'
          && inputs.pr != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT_PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      # A review-signal workflow_run may identify a merge ref rather than the
      # PR head, so leave it blank and resolve the live head read-only below.
      HEAD_SHA: ${{ (github.event.workflow_run.name == 'CI' && github.event.workflow_run.head_sha) || '' }}
      RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      # workflow_run does not carry the upstream review actor. The unprivileged
      # signal workflow attests its Bot-only event and PR number in a run-scoped
      # artifact. Validate it before the first status write or checkout.
      - name: Validate bot review signal
        if: github.event.workflow_run.name == 'gate-review-signal'
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/gate-review-signal"
          gh run download "${UPSTREAM_RUN_ID}" -R "${REPO}" \
            -n gate-review-signal -D "$dir"
          signal="$dir/gate-review-signal.json"
          test "$(jq -r '.actor_type' "$signal")" = "Bot"
          test -n "$(jq -r '.reviewer' "$signal")"
          EVENT_PR=$(jq -r '.pr' "$signal")
          test "$EVENT_PR" -ge 1
          echo "EVENT_PR=${EVENT_PR}" >> "$GITHUB_ENV"

      # issue_comment and review-signal workflow_run do not carry a trustworthy
      # PR head. Resolve that fact read-only before the first status write. The
      # CI workflow_run path already carries HEAD_SHA and skips the API call.
      - name: Resolve event head
        run: |
          set -euo pipefail
          if [ -n "${HEAD_SHA}" ]; then
            exit 0
          fi
          if [ -z "${EVENT_PR}" ]; then
            echo "event did not identify a pull request" >&2
            exit 1
          fi
          HEAD_SHA=$(gh pr view "${EVENT_PR}" -R "${REPO}" --json headRefOid --jq .headRefOid)
          test -n "${HEAD_SHA}"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"

      # Invalidate any prior status on this head before any cancellable
      # work (checkout, build, PR resolve). A persistent gate=success from an earlier
      # single-PR run would otherwise survive if THIS run is cancelled mid-build —
      # a user with Actions rights could cancel the run during that window to keep
      # the stale green satisfying a newly-opened second PR. Posting `pending`
      # marks the head non-green until this run's real verdict lands; if the run
      # is cancelled, pending remains and branch protection blocks (fail closed).
      # It is the first effectful step; issue_comment's required read-only head
      # lookup is the only step before it.
      - name: Invalidate prior gate status
        run: |
          # Best-effort is not enough here: if this write silently failed and the
          # run were then cancelled mid-build, a stale gate=success would survive —
          # the exact window this step exists to close. Make invalidation a VERIFIED
          # prerequisite: retry a few times, and FAIL the job if it never lands, so
          # we never proceed into cancellable work believing the head was
          # invalidated when it wasn't (a failed job is loud and posts no success).
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
                 -f state=pending -f context=gate \
                 -f description="gate: evaluating" \
                 -f target_url="${RUN_URL}" >/dev/null; then
              exit 0
            fi
            echo "invalidation attempt ${attempt} failed; retrying" >&2
            sleep 2
          done
          echo "could not invalidate prior gate status after retries" >&2
          exit 1

      # Explicit default-branch ref is load-bearing now that review events also
      # trigger this workflow: their event SHA may be a PR merge ref. Gate must
      # always build from trusted base code, never PR/fork code.
      - name: Checkout base (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Built from the base checkout above — never from PR head. triage-floor
      # (gate's floor rung) is built here too so the hosted runner has it on the
      # workspace; its path is passed to gate via -floor below.
      - name: Build gate + triage-floor
        run: |
          go build -o gate ./cmd/gate
          go build -o triage-floor ./cmd/triage/triage-floor

      # Resolve the PR from the event. One commit can back several open PRs
      # (different bases). The gate status is commit-scoped, so evaluating
      # whichever PR the event names could stamp an easier PR's green onto a head
      # another PR shares (a review-policy-differential bypass). So the ambiguity
      # check is UNCONDITIONAL — run it whether or not the event named a same-repo
      # PR. Only an UNAMBIGUOUS mapping is gateable; anything else posts nothing,
      # and branch protection blocks on the absent context (fail closed).
      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          # overwrite_and_refuse posts a non-success gate status to HEAD_SHA and
          # bails. Used whenever we cannot safely resolve a unique open PR: a
          # persistent gate=success from a prior single-PR run would otherwise
          # linger (commit statuses persist) and satisfy a newcomer's required
          # context. Overwriting it keeps the head non-green (best-effort — a POST
          # failure here is a total-gh-outage residual). Fail closed.
          overwrite_and_refuse() {
            echo "refusing to gate ${HEAD_SHA}: $1"
            gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="$2" -f context=gate \
              -f description="$(printf '%s' "gate: $1" | head -c 110)" \
              -f target_url="${RUN_URL}" >/dev/null || true
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # commits->pulls lists PRs ASSOCIATED with this commit — same-repo PRs
          # and fork PRs (their head lands in the base repo's refs/pull/*). This
          # query is load-bearing (uniqueness gates the whole run), so a query
          # FAILURE must not silently exit under set -e and leave a stale success —
          # capture it and overwrite with an error.
          # --paginate: the endpoint returns 30 records/page; without it an
          # attacker could push a restrictive open PR onto page 2 while an easier
          # one sits on page 1, so the first-page-only filter sees just the easier
          # PR and greens the head for both. --jq '.[]' streams every page's
          # elements; jq -s below slurps them into one array before filtering.
          if ! raw=$(gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/pulls" --jq '.[]'); then
            overwrite_and_refuse "could not resolve open PRs for head (query failed)" error
          fi
          # Count only OPEN PRs whose HEAD is this exact SHA. The endpoint also
          # returns CLOSED/MERGED PRs, and PRs merely ASSOCIATED with the commit —
          # e.g. a stacked PR that contains it in history but has advanced to a
          # different tip. Those are gated on their OWN head, not this one, so
          # neither must count toward this head's ambiguity (else a valid lower PR
          # in a stack, or a head with an old closed PR, could never clear).
          nums=$(printf '%s' "$raw" | jq -s -c --arg sha "$HEAD_SHA" \
            '[.[] | select(.state == "open" and .head.sha == $sha) | .number] | unique')
          n=$(printf '%s' "$nums" | jq 'length')
          # Refuse any head that backs more than one OPEN PR (regardless of path):
          # the gate status is commit-scoped, so gating one could stamp its green
          # onto the head a second shares.
          if [ "$n" -gt 1 ]; then
            overwrite_and_refuse "ambiguous: head backs ${n} open PRs" failure
          fi
          # Gate the SOLE OPEN PR the API reports — it is authoritative. Do NOT
          # blindly trust the event's PR number: it may name a PR that has since
          # merged/closed while a DIFFERENT open PR now heads this SHA, and gate
          # would then judge the closed one (leniently — readiness exempts MERGED
          # subjects) and stamp that verdict onto the open one. Fall back to the
          # event number ONLY when the API lists no open PR (association can lag
          # briefly for a fresh same-repo PR).
          if [ "$n" -eq 1 ]; then
            num=$(printf '%s' "$nums" | jq -r '.[0]')
          else
            num="${EVENT_PR}"
          fi
          if [ -z "$num" ]; then
            echo "no open PR resolves for ${HEAD_SHA}; nothing to gate"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "resolved PR #${num}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=${num}" >> "$GITHUB_OUTPUT"

      # gate treats ANY non-green check (pending/queued/in-progress) as a block
      # (fail closed). Reading mid-flight CI would therefore block spuriously,
      # so wait until every check that is NOT `gate` has settled before running.
      # Bounded: on timeout we proceed anyway — a still-pending check just makes
      # gate block, which is the safe direction.
      #
      # `gh pr checks` exits non-zero when checks are pending (8) or failing (1),
      # so its exit code is captured and ignored; only the JSON drives the loop.
      # The settled/not-settled decision keys off the `bucket` field (pass / fail
      # / pending / skipping / cancel) — `pending` is the only unsettled bucket.
      - name: Wait for other checks to settle
        if: steps.pr.outputs.found == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 300 ))
          while :; do
            checks=$(gh pr checks "$PR" --json name,bucket 2>/dev/null || true)
            if [ -z "$checks" ]; then
              echo "no checks reported yet; proceeding"
              break
            fi
            pending=$(printf '%s' "$checks" \
              | jq '[.[] | select(.name != "gate") | select(.bucket == "pending")] | length')
            if [ "$pending" -eq 0 ]; then
              echo "all non-gate checks settled"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timeout with ${pending} check(s) still pending; proceeding (gate will block on them)"
              break
            fi
            echo "waiting on ${pending} pending check(s)..."
            sleep 15
          done

      # Mint an ephemeral grant and run gate as a DRY RUN (never -live). The
      # grant, state, and keys live in a throwaway temp dir per run, so no
      # signing secret ever touches CI. -key must sit outside -state (gate
      # refuses a nested key dir).
      #
      # -max-tier T3 / -max-cycles 0: this check reflects gate's LADDER verdict
      # (block / escalate / pass), not a tier or cycle ceiling. A CI runner has
      # no operator to re-mint a wider grant or judge an escalation, and the
      # per-run ephemeral state makes cross-run cycle counting meaningless — so
      # the ceilings are opened to their widest and the check stands or falls on
      # the ladder alone.
      - name: Run gate
        id: gate
        if: steps.pr.outputs.found == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          # Cloud backend remains available to the red-CI classifier; paid
          # review consolidation is skipped below. Fork-safe: this step runs
          # only in the trusted base context (workflow_run), never fork code,
          # so the secret is never exposed to a PR/fork.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          # Erase the ephemeral state/key dir on exit — no minted grant or key
          # survives the step, matching the "erased with it" guarantee.
          trap 'rm -rf "$TMP"' EXIT
          # -init: the mktemp state dir is intentionally fresh every run, so gate
          # must be told to create a new state tree rather than refuse to mint
          # into one with no existing log.jsonl (its default fail-closed posture).
          GRT=$(./gate grant -repo "$REPO" -action merge -max-tier T3 -max-cycles 0 -ttl 1h \
            -state "$TMP/state" -key "$TMP/keys" -init)
          echo "minted ephemeral grant"
          set +e
          # -reviews-optional skips only paid review-consolidation for the enforced
          # CI check. Exact-head panel completeness remains deterministic and
          # required. The local-model rung escalates on uncertainty, and this
          # ephemeral CI run has no judge for a model-only park. Under this flag,
          # readiness accepts an absent GitHub aggregate review decision and the
          # paid findings rung is skipped. Deterministic readiness, risk floor, and
          # panel completeness still gate; panel completion comes from exact-head
          # review submissions or the authenticated Codex clean-result sentinel,
          # never arbitrary review prose.
          #
          # -stamp=false: this run's state/key dir is erased by the EXIT trap above,
          # so a gate/authorized status posted here would carry a run+hash whose only
          # audit ledger is already destroyed — an unverifiable stamp. The workflow's
          # own status-posting step (the trusted, armed rail) owns any CI-side stamp.
          JSON=$(./gate gate -repo "$REPO" -pr "$PR" -grant "$GRT" -state "$TMP/state" -key "$TMP/keys" \
            -model-backend cloud -reviews-optional -floor "$PWD/triage-floor" -stamp=false)
          CODE=$?
          set -e
          # Persist the raw outcome for the status-posting step and the summary.
          printf '%s\n' "$JSON" > gate-outcome.json
          {
            echo "## gate outcome (exit ${CODE})"
            echo '```json'
            cat gate-outcome.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The code= write MUST stay the effective last action of this step: if
          # any line above fails under set -e, code= is never written, the next
          # step sees an empty CODE, and it posts error (fail closed) rather than
          # acting on a half-finished run.
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      # Map gate's exit code to the `gate` commit status. FAIL CLOSED: state=success
      # is posted ONLY when gate exited 0 AND its verdict is bound to the exact
      # head it judged. Block/park/refuse are failures; anything else is an error.
      # The context is exactly `gate` — branch protection requires that context.
      #
      # Two distinct failure surfaces, both fail-closed:
      #   * A PRIOR step failed (checkout, build, PR resolve, or the gate step
      #     itself erroring out). This step's `if:` has no status function, so it
      #     is implicitly `success() && <cond>` — a failed prior step SKIPS this
      #     step, so NO status is posted. An absent `gate` context makes branch
      #     protection block the merge. (There is no continue-on-error on the gate
      #     step, so a gate crash cannot be laundered into a pass.)
      #   * This step RUNS but the run was incomplete — CODE empty (the gate step
      #     succeeded as a step but never wrote code=) or gate-outcome.json
      #     missing / empty / not valid JSON (gate errored before printing its
      #     result). Handled in-step below by posting state=error, so a broken run
      #     lands a visible error rather than silently doing nothing.
      #
      # SHA BINDING (the TOCTOU fix): gate computes its verdict from the LIVE PR
      # head it reads at run time (emitted as .head_sha), while this status is
      # posted to HEAD_SHA, the head fixed in the workflow_run event when CI
      # completed. Those can differ — a force-push can move the live head under
      # the run — so a green verdict for one commit must never be stamped onto a
      # different one. success is therefore gated on JUDGED == HEAD_SHA (and the
      # outcome being would_merge, so code and outcome agree). If they diverge we
      # post error("stale: head moved"), never success.
      - name: Post gate status
        if: steps.pr.outputs.found == 'true'
        env:
          CODE: ${{ steps.gate.outputs.code }}
          RESOLVED_PR: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail
          # Descriptions are capped well under GitHub's 140-char status limit.
          trunc() { printf '%s' "$1" | head -c 110; }

          # Parse the outcome defensively: a missing / empty / invalid
          # gate-outcome.json, or an empty CODE, means the run did not finish
          # cleanly. Never let a jq failure abort this step (that would skip the
          # post and leave the status absent) — force the error path instead.
          why=""; tier=""; outcome=""; JUDGED=""; broken=""
          if [ -z "${CODE}" ]; then
            broken="gate did not report an exit code"
          elif [ ! -s gate-outcome.json ] || ! jq -e . gate-outcome.json >/dev/null 2>&1; then
            broken="gate produced no valid outcome JSON"
          else
            why=$(jq -r '.why // ""' gate-outcome.json)
            tier=$(jq -r '.tier // ""' gate-outcome.json)
            outcome=$(jq -r '.outcome // ""' gate-outcome.json)
            JUDGED=$(jq -r '.head_sha // ""' gate-outcome.json)
          fi

          if [ -n "$broken" ]; then
            STATE=error; DESC="gate error: $(trunc "$broken")"
          else
            case "$CODE" in
              0)
                # A pass is honoured only if it is bound to the head this status
                # targets and the outcome agrees with the code. Any mismatch means
                # the live head moved (or the run is inconsistent): fail closed.
                if [ "$JUDGED" != "$HEAD_SHA" ] || [ "$outcome" != "would_merge" ]; then
                  STATE=error; DESC="stale: head moved during gate run"
                else
                  # Re-check at POST time (TOCTOU): between the Resolve step and
                  # now, the PR set on this head may have changed. Verify the head
                  # is still backed by EXACTLY the PR we judged — not merely that
                  # some single open PR exists: if the judged PR A closed and a
                  # different PR B opened on the same head, a count-only check would
                  # be 1 and stamp A's verdict onto B (different base/review policy).
                  # Success posts ONLY when the open PRs headed by this SHA are
                  # exactly [RESOLVED_PR]; a query error (→ literal "mismatch") or
                  # any other set posts failure. Fail closed by default.
                  postok=$(gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/pulls" --jq '.[]' 2>/dev/null \
                    | jq -s -r --arg sha "$HEAD_SHA" --argjson pr "${RESOLVED_PR}" \
                      '([.[] | select(.state == "open" and .head.sha == $sha) | .number] | unique) == [$pr]' 2>/dev/null || echo mismatch)
                  if [ "$postok" = "true" ]; then
                    STATE=success; DESC="would_merge (${tier})"
                  else
                    STATE=failure; DESC="ambiguous at post: head no longer maps to PR #${RESOLVED_PR}; refusing"
                  fi
                fi
                ;;
              1) STATE=failure; DESC="blocked: $(trunc "$why")" ;;
              2) STATE=failure; DESC="parked_for_judgment: $(trunc "$why")" ;;
              3) STATE=failure; DESC="capability_refused" ;;
              *) STATE=error;   DESC="gate error: $(trunc "$why")" ;;
            esac
          fi

          echo "posting gate=${STATE}: ${DESC} (code=${CODE:-<none>} judged=${JUDGED:-<none>} target=${HEAD_SHA})"
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context=gate \
            -f description="$DESC" \
            -f target_url="$RUN_URL"

  policy-recheck:
    # Only a trusted default-branch policy commit may fan out privileged
    # re-evaluations. A PR-head edit to .ship.json never reaches this job.
    if: >-
      vars.GATE_ENFORCE == 'true'
      && github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      - name: Invalidate and re-evaluate every open PR
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.sha] | @tsv' |
          while IFS=$'\t' read -r pr head; do
            test -n "$pr"
            test -n "$head"
            # Invalidate first. If dispatch fails, pending remains fail-closed
            # instead of preserving a success under the old policy.
            gh api -X POST "repos/${REPO}/statuses/${head}" \
              -f state=pending -f context=gate \
              -f description="gate: policy changed; re-evaluating" \
              -f target_url="${RUN_URL}" >/dev/null
            gh workflow run gate.yml -R "${REPO}" --ref "${DEFAULT_BRANCH}" \
              -f "pr=${pr}"
          done
