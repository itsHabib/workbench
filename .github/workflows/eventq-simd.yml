name: Eventq experimental SIMD
on:
  pull_request:
    paths: ['cmd/eventq/**', 'go.mod', 'go.sum', '.github/workflows/eventq-simd.yml']
  push:
    branches: [main]
    paths: ['cmd/eventq/**', 'go.mod', 'go.sum', '.github/workflows/eventq-simd.yml']
permissions:
  contents: read
jobs:
  simd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go test -race ./cmd/eventq/...
        env:
          GOEXPERIMENT: simd
      - run: go test ./cmd/eventq/...
        env:
          GOEXPERIMENT: simd
          GODEBUG: simd=0
