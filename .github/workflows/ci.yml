name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a PR's superseded CI runs when a new commit lands: without this a
# rapid push loop spawns O(pushes) CI runs, each of which fans out a gate run
# (see .github/workflows/gate.yml). One live run per PR (or per main-push ref)
# caps that fan-out at the source. Keyed by ref so main pushes serialize too.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# One module, so `check` runs the whole tree: a shared `contracts` change must
# retest every consumer, and module-wide `go test` is faster + safer than
# path-filtering that could green a tool whose contract shifted under it.
# Per-tool path-filtered jobs are a documented follow-up (FOLLOWUPS.md), owed
# only once the tool count or test time makes module-wide retest wasteful.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:" && echo "$out" && exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        if: always()
        run: |
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -n 1 >> $GITHUB_STEP_SUMMARY
          else
            echo "_no coverage profile produced — see test step for failure details_" >> $GITHUB_STEP_SUMMARY
          fi
      - name: upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          retention-days: 30
          if-no-files-found: ignore
          path: coverage.out
      - name: go build
        run: go build ./...
      # The tracelens corpus gate: a detector regression against the labeled
      # corpus fails CI, not just the tool's own tests.
      - name: tracelens corpus gate
        run: go run ./cmd/tracelens eval ./cmd/tracelens/testdata/corpus

  # A short, budgeted fuzz smoke over the ledger byte parsers — the functions
  # that read possibly-crash-torn, possibly-adversarial bytes off disk. This is a
  # regression guard, not an exhaustive search: each target runs from its inlined
  # seed corpus for a fixed EXECUTION-COUNT budget, and any panic or falsified
  # invariant fails CI with the reproducing input written under testdata/fuzz.
  # The deep search is a local `go test -fuzz` with a longer -fuzztime.
  #
  # The budget is a count (Nx), not a duration: a wall-clock -fuzztime races the
  # worker-shutdown handshake at the deadline and can spuriously fail the run with
  # "context deadline exceeded" even when no input crashed. A count is
  # deterministic and has no deadline to race.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz ledger byte parsers
        # -run '^$' skips the unit tests so the budget goes entirely to fuzzing;
        # each -fuzz regexp is end-anchored to select exactly one target.
        run: |
          budget=500000x
          run_fuzz() {
            echo "== fuzz $2 ($1) =="
            go test "$1" -run '^$' -fuzz "$2" -fuzztime "$budget"
          }
          run_fuzz ./contracts/driverstate 'FuzzDecodeEvent$'
          run_fuzz ./contracts/driverstate 'FuzzReadLedger$'
          run_fuzz ./driverstate 'FuzzDecodeLedger$'
          run_fuzz ./driverstate 'FuzzTornTailHeal$'

  # The boundary law, enforced mechanically instead of by discipline:
  # "share contracts, not call stacks." contracts imports nothing else in the
  # module; local (a shared mechanism package) imports at most contracts; no
  # tool imports another tool's decision code. A breach fails here.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: contracts is a leaf
        # Every contracts domain (contracts, contracts/execution, ...) is its
        # own leaf: it imports nothing else in the module, not even a sibling
        # domain.
        run: |
          mod=github.com/itsHabib/workbench
          fail=0
          for pkg in $(go list ./contracts/...); do
            deps=$(go list -deps "$pkg" | grep "^${mod}/" | grep -v "^${pkg}\$" || true)
            if [ -n "$deps" ]; then
              echo "$pkg must import nothing else in the module, but pulls in:" >&2
              echo "$deps" >&2
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then echo "contracts domains are leaves ✓"; fi
          exit $fail
      - name: local is a mechanism leaf
        # "at most contracts" means any contracts domain — root or a
        # sub-domain like contracts/execution. Shared vocabulary is importable
        # by law; decision code never lives there, so nothing extra leaks in.
        run: |
          mod=github.com/itsHabib/workbench
          deps=$(go list -deps ./local | grep "^${mod}/" | grep -Ev "^${mod}/(local|contracts(/.*)?)$" || true)
          if [ -n "$deps" ]; then
            echo "local is a shared mechanism and may import at most contracts, but pulls in:" >&2
            echo "$deps" >&2
            exit 1
          fi
          echo "local is a mechanism leaf ✓"
      - name: no tool imports another tool's code
        run: |
          mod=github.com/itsHabib/workbench
          fail=0
          for tooldir in cmd/*/; do
            tool=$(basename "$tooldir")
            deps=$(go list -deps ./cmd/$tool/... | grep "^${mod}/cmd/" || true)
            bad=$(echo "$deps" | grep -Ev "^${mod}/cmd/${tool}(/|\$)" || true)
            if [ -n "$bad" ]; then
              echo "cmd/$tool reaches into another tool's tree:" >&2
              echo "$bad" >&2
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then echo "no cross-tool imports ✓"; fi
          exit $fail
      - name: gate review retriggers stay trusted and bot-only
        run: |
          workflow=.github/workflows/gate.yml
          signal=.github/workflows/gate-review-signal.yml
          grep -F 'workflows: ["CI", "gate-review-signal"]' "$workflow"
          grep -F '  issue_comment:' "$workflow"
          grep -F '    types: [created, edited, deleted]' "$workflow"
          grep -F '  workflow_dispatch:' "$workflow"
          grep -F '    paths: [".ship.json"]' "$workflow"
          grep -F "github.event.comment.user.login == 'chatgpt-codex-connector[bot]'" "$workflow"
          grep -F '  identity:' "$workflow"
          grep -F '    needs: identity' "$workflow"
          grep -F '      group: gate-' "$workflow" | grep -F 'needs.identity.outputs.pr'
          grep -F 'needs.identity.result' "$workflow"
          grep -F 'github.event.issue.number || inputs.pr' "$workflow"
          grep -F '      EVENT_PR:' "$workflow" | grep -F 'needs.identity.outputs.pr'
          grep -F 'repos/${REPO}/commits/${HEAD_SHA}/pulls' "$workflow"
          grep -F 'head=${HEAD_OWNER}:${HEAD_BRANCH}' "$workflow"
          grep -F '          ref:' "$workflow" | grep -F 'github.event.repository.default_branch'
          grep -F "github.ref_name == github.event.repository.default_branch" "$workflow"
          grep -F '          prs="$(mktemp)"' "$workflow"
          grep -F '          invalidate_failed=0' "$workflow"
          grep -F '          dispatch_failed=0' "$workflow"
          grep -F '          fanout_failed=0' "$workflow"
          grep -F '          if [ "$invalidate_failed" -ne 0 ] || [ "$dispatch_failed" -ne 0 ]; then' "$workflow"
          grep -F '          exit "$fanout_failed"' "$workflow"
          grep -F 'gh workflow run gate.yml' "$workflow"
          grep -F 'description="gate: policy changed; re-evaluating"' "$workflow"
          invalidate_line="$(grep -n -F '          invalidate_failed=0' "$workflow" | cut -d: -f1)"
          dispatch_line="$(grep -n -F '          dispatch_failed=0' "$workflow" | cut -d: -f1)"
          fanout_line="$(grep -n -F '          fanout_failed=0' "$workflow" | cut -d: -f1)"
          test "$invalidate_line" -lt "$dispatch_line"
          test "$dispatch_line" -lt "$fanout_line"
          grep -F '  pull_request_review:' "$signal"
          grep -F "if: github.event.review.user.type == 'Bot'" "$signal"
          grep -F 'uses: actions/upload-artifact@v4' "$signal"
          grep -F 'gh run download "${UPSTREAM_RUN_ID}"' "$workflow"
          if grep -Fq 'actions/checkout' "$signal"; then
            echo "review signal must never check out PR code" >&2
            exit 1
          fi
          if grep -Eq '^  (pull_request|pull_request_target):' "$workflow"; then
            echo "gate workflow must not run privileged work from a PR-head trigger" >&2
            exit 1
          fi
          if grep -F 'group:' "$workflow" | grep -Fq 'head_branch'; then
            echo "gate concurrency must use the resolved PR, never a trigger-specific branch fallback" >&2
            exit 1
          fi
          echo "gate review retriggers are base-workflow bot events ✓"
      - name: gate authorization promotion stays environment-protected
        run: |
          workflow=.github/workflows/gate-authorization.yml
          grep -F '  workflow_dispatch:' "$workflow"
          grep -F '    environment: gate-authorization' "$workflow"
          grep -F '    if: github.ref_name == github.event.repository.default_branch' "$workflow"
          grep -F '      group: gate-authorization-${{ github.repository }}' "$workflow"
          grep -F '      statuses: write' "$workflow" || grep -F '  statuses: write' "$workflow"
          grep -F '          ref: ${{ github.event.repository.default_branch }}' "$workflow"
          grep -F '          persist-credentials: false' "$workflow"
          grep -F './gate authorization promote' "$workflow"
          if grep -Eq '^  (pull_request|pull_request_target|repository_dispatch):' "$workflow"; then
            echo "authorization promotion must be workflow_dispatch-only" >&2
            exit 1
          fi
          if grep -Fq 'github.event.pull_request.head' "$workflow"; then
            echo "authorization promotion must never check out PR code" >&2
            exit 1
          fi
          echo "gate authorization promotion is trusted-base and environment-protected ✓"
